name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run the Action on sample files
        run: node test/run.cjs
      - name: Check this repo's own ACR.md
        uses: ./
